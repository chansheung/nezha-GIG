# =============================================================================
# CVE-2026-53519 Temporary Nginx Mitigation
# Place inside your server { } block BEFORE the proxy_pass to nezha-dashboard.
# This blocks path traversal payloads targeting /dashboard prefix confusion.
#
# IMPORTANT: This is a STOPGAP only. Rebuild the binary with build/ for a
# permanent fix. These rules go in the server{} context, NOT inside location{}.
# =============================================================================

# Block /dashboard followed by a character that's NOT / or ?
# Catches: /dashboard.., /dashboard%2e, /dashboard%2f
# Allows:  /dashboard/, /dashboard?lang=en (query string)
if ($request_uri ~* "^/dashboard[^/?]") {
    return 403;
}

# Block literal ../ anywhere in the raw URI
# Catches: /dashboard/../data/config.yaml
if ($request_uri ~* "\.\./") {
    return 403;
}

# Block encoded path traversal sequences
# Catches: %2e%2e, %2e., .%2e, double-encoded %252e, %255c
if ($request_uri ~* "(%2e%2e|%2e\.|\.%2e|%252e|%255c)") {
    return 403;
}

# Block direct access to sensitive files (anchored to top-level path)
# Uses $uri (Nginx-normalized) so /dashboard/../data → /data is caught too
location ~* ^/(data|\.env|config\.yaml|\.git)(/|$) {
    return 404;
}
